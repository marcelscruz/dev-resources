name: Insert ScreenSize entry

on:
  push:
    branches:
      - add-screensize
    paths:
      - .github/workflows/add-screensize.yml

permissions:
  contents: write

jobs:
  insert-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-screensize
      - name: Insert ScreenSize object into resources/s.ts
        run: |
          python3 <<'PYEOF'
          import sys

          path = 'resources/s.ts'
          raw = open(path, 'rb').read().decode('utf-8')
          newline = '\r\n' if '\r\n' in raw else '\n'
          src = raw.replace('\r\n', '\n')

          if 'screensize.net' in src:
              print('ScreenSize entry already present; nothing to do.')
              sys.exit(0)

          anchor = "name: 'Screenshot Scout',"
          if src.count(anchor) != 1:
              sys.exit(f"anchor occurs {src.count(anchor)} times, expected exactly 1")

          lines = src.split('\n')
          anchor_idx = next(i for i, l in enumerate(lines) if anchor in l)
          name_indent = lines[anchor_idx][:len(lines[anchor_idx]) - len(lines[anchor_idx].lstrip())]
          brace_indent = name_indent[:-2] if len(name_indent) >= 2 else name_indent
          close_idx = next(i for i in range(anchor_idx, len(lines)) if lines[i].strip() == '},')
          print('anchor line:', repr(lines[anchor_idx]))
          print('close line:', repr(lines[close_idx]))

          ni = name_indent
          di = name_indent + '  '
          entry = [
              brace_indent + '{',
              ni + "name: 'ScreenSize',",
              ni + "description: 'Check your screen size, viewport, resolution and device pixel ratio in real time, with device screen specs and Tailwind/Bootstrap breakpoint references.',",
              ni + "categories: ['Browser', 'Design'],",
              ni + "url: 'https://screensize.net',",
              ni + 'keywords: [',
              di + "'screen size',",
              di + "'viewport',",
              di + "'resolution',",
              di + "'responsive design',",
              di + "'breakpoints',",
              ni + '],',
              brace_indent + '},',
          ]
          lines[close_idx + 1:close_idx + 1] = entry
          open(path, 'w', encoding='utf-8', newline='').write(newline.join(lines))
          print('inserted ScreenSize entry after Screenshot Scout')
          PYEOF
      - name: Verify and push
        run: |
          grep -n "screensize.net" resources/s.ts
          git config user.name "screensizenet"
          git config user.email "screensizenet@users.noreply.github.com"
          git add resources/s.ts
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Add ScreenSize"
          git push origin HEAD:add-screensize
